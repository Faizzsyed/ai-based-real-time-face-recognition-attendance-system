[project]
name = "attendai"
version = "0.14.0"
description = "AI Based Real-Time Face Recognition Attendance System mobile client"
# Desktop development remains Python 3.11; Flet Android packages use its
# supported embedded runtime range (currently Python 3.12–3.14).
requires-python = ">=3.12,<3.15"
dependencies = [
    "flet==0.86.5",
    "httpx==0.28.1",
    "pydantic-settings==2.15.0",
]

[tool.flet]
org = "com.faizzsyed"
product = "AI Attendance"
project = "attendai"
description = "Secure academic attendance workflows"
permissions = ["camera", "photo_library"]

[tool.flet.android]

[tool.flet.android.app]
exclude = ["build", ".venv", "__pycache__", ".pytest_cache", "tests", "test_*.py", "data", "models", "*.onnx", "*.task", "*.apk", "*.aab"]
